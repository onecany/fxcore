<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="fxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="fxUp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- 图标:FX 组合 + 上升趋势 + 核心圆点 -->
  <g transform="translate(4,4)">
    <!-- 徽章 -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0a1220" stroke="url(#fxAccent)" stroke-width="1.5"/>
    <rect x="0" y="0" width="56" height="56" rx="14" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="5"/>

    <!-- K线蜡烛组(accent 蓝) -->
    <g opacity="0.9">
      <line x1="17" y1="13" x2="17" y2="43" stroke="url(#fxAccent)" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="14.5" y="20" width="5" height="14" rx="1" fill="url(#fxAccent)"/>
      <line x1="29" y1="17" x2="29" y2="39" stroke="url(#fxAccent)" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      <rect x="26.5" y="23" width="5" height="10" rx="1" fill="url(#fxAccent)" opacity="0.55"/>
    </g>

    <!-- 上升趋势线(绿) -->
    <path d="M12 44 L25 31 L38 18" stroke="url(#fxUp)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 18 h4 v4" stroke="url(#fxUp)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 核心圆点(趋势线终点) -->
    <circle cx="42" cy="14" r="3" fill="url(#fxUp)"/>
    <circle cx="42" cy="14" r="5.5" fill="none" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
  </g>

  <!-- 文字标 -->
  <text x="76" y="44" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="34" font-weight="700" letter-spacing="1" fill="#d8e6f5">FX<tspan fill="url(#fxAccent)">core</tspan></text>
  <text x="77" y="56" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing="3.2" fill="#5c6f8c">AUTONOMOUS AI TRADING</text>
</svg>
