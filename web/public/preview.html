<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>FXcore Logo Preview</title>
<style>
body { background:#070b14; font-family:monospace; margin:0; padding:48px; }
h3 { color:#8fa3bf; font-weight:500; letter-spacing:1px; margin:32px 0 12px; }
.row { display:flex; gap:40px; align-items:center; }
.card { background:rgba(13,20,36,0.72); border:1px solid rgba(56,189,248,0.14); border-radius:12px; padding:28px 32px; }
.hint { color:#5c6f8c; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <h3>FXcore 横向 Logo(导航栏/页头)</h3>
  <div class="card"><img src="fxcore-logo.svg" width="300" alt="fxcore logo"><div class="hint">fxcore-logo.svg · 240×64 · 图标+文字</div></div>

  <h3>FXcore 图标(浅色场景)</h3>
  <div class="card" style="background:#f8fafc;border-color:rgba(56,189,248,0.4)"><img src="fxcore-icon.svg" width="64" alt="fxcore icon"><div class="hint" style="color:#5c6f8c">fxcore-icon.svg · 64×64 · favicon 用</div></div>

  <h3>缩放演示(16 / 32 / 64 / 128px)</h3>
  <div class="card"><div class="row">
    <img src="fxcore-icon.svg" width="16"><img src="fxcore-icon.svg" width="32"><img src="fxcore-icon.svg" width="64"><img src="fxcore-icon.svg" width="128">
  </div><div class="hint">小尺寸可辨识性(核心圆点 + 上升线)</div></div>
</body>
</html>
