<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fxAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="fxUp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- 徽章 -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#0a1220" stroke="url(#fxAccent)" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="5"/>

  <!-- K线蜡烛组 -->
  <g opacity="0.9">
    <line x1="19" y1="14" x2="19" y2="48" stroke="url(#fxAccent)" stroke-width="1.7" stroke-linecap="round"/>
    <rect x="16" y="22" width="6" height="15" rx="1.2" fill="url(#fxAccent)"/>
    <line x1="33" y1="18" x2="33" y2="44" stroke="url(#fxAccent)" stroke-width="1.7" stroke-linecap="round" opacity="0.55"/>
    <rect x="30" y="26" width="6" height="11" rx="1.2" fill="url(#fxAccent)" opacity="0.55"/>
  </g>

  <!-- 上升趋势线 -->
  <path d="M12 49 L27 34 L42 19" stroke="url(#fxUp)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 19 h4 v4" stroke="url(#fxUp)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 核心圆点 -->
  <circle cx="47" cy="14" r="3.2" fill="url(#fxUp)"/>
  <circle cx="47" cy="14" r="6" fill="none" stroke="rgba(52,211,153,0.35)" stroke-width="1.6"/>
</svg>
